name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-checks:
    name: Software checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            rdk_video_push/requirements.txt
            rdk_video_push/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r rdk_video_push/requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q rdk_video_push tests

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find rdk_video_push/scripts -type f -name '*.sh' -print0)

      - name: Run unit tests
        run: python -m pytest -q

      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          artifacts="$({ git ls-files | grep -E '(^|/)(logs?|__pycache__)(/|$)|\.(h264|pid|pyc)$'; } || true)"
          if [[ -n "$artifacts" ]]; then
            echo "Runtime artifacts must not be tracked:"
            echo "$artifacts"
            exit 1
          fi
