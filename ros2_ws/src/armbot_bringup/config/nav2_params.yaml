# =============================================================================
# Nav2 Configuration for Armbot
# =============================================================================
# This file configures the full Navigation2 stack for the Armbot mecanum
# chassis robot. All nodes share the same namespace and parameter file.
#
# Frame convention:
#   map -> odom -> base_link -> laser
#
# Key design decisions:
#   - NavFn planner (lightweight, suitable for RDK X5 ARM CPU)
#   - RegulatedPurePursuit controller (stable indoor navigation)
#   - 3m x 3m local costmap, 0.05m resolution
#   - Conservative speeds: 0.25 m/s linear, 0.8 rad/s angular
# =============================================================================

# =============================================================================
# AMCL / Localization
# =============================================================================
# Note: We use slam_toolbox in localization mode instead of AMCL by default.
# This avoids needing a separate AMCL config. If you prefer AMCL, uncomment
# the amcl section below and swap the localization_node in nav.launch.py.
#
# amcl:
#   ros__parameters:
#     use_sim_time: false
#     alpha1: 0.2
#     alpha2: 0.2
#     alpha3: 0.2
#     alpha4: 0.2
#     alpha5: 0.2
#     base_frame_id: "base_link"
#     beam_skip_distance: 0.5
#     beam_skip_error_threshold: 0.9
#     beam_skip_threshold: 0.3
#     do_beamskip: false
#     global_frame_id: "map"
#     lambda_short: 0.1
#     laser_likelihood_max_dist: 2.0
#     laser_max_range: 8.0
#     laser_min_range: -1.0
#     laser_model_type: "likelihood_field"
#     max_beams: 60
#     max_particles: 2000
#     min_particles: 500
#     odom_frame_id: "odom"
#     pf_err: 0.05
#     pf_z: 0.99
#     recovery_alpha_fast: 0.0
#     recovery_alpha_slow: 0.0
#     resample_interval: 1
#     robot_model_type: "differential"
#     save_pose_rate: 0.5
#     sigma_hit: 0.2
#     tf_broadcast: true
#     transform_tolerance: 1.0
#     update_min_a: 0.2
#     update_min_d: 0.25
#     z_hit: 0.5
#     z_max: 0.05
#     z_rand: 0.5
#     z_short: 0.05
#     scan_topic: /scan_filtered

# =============================================================================
# Controller Server
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # --- Progress checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15    # 8-30 修复: 0.2→0.15（原地转头也算进展，避免转一半被判失败）
      movement_time_allowance: 20.0    # 8-30 修复: 12→20（留足 180° 转头时间）

    # --- Goal checker ---
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: true

    # --- FollowPath (DWB — Dynamic Window Approach) ---
    # DWB samples velocity space (vx, vy, wz) and scores each trajectory
    # against costmap obstacles. With vy enabled, the mecanum chassis can
    # strafe sideways to avoid obstacles instead of stopping to rotate.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: -0.15
      max_vel_x: 0.15
      max_vel_y: 0.15
      max_vel_theta: 0.6    # 8-29 18:00: 0.4→0.6（旋转更快，目标在后方时转弯更果断）
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: -0.3
      decel_lim_theta: -1.5
      vx_samples: 8
      vy_samples: 4                 # 8-30 修复: 8→4（横移采样减半防 controller 掉帧，掉帧导致控制断续）
      vtheta_samples: 8   # 8-29 18:00: 6→8（旋转采样更细）
      sim_time: 1.5    # 8-29 18:00: 1.0→1.5（轨迹仿真更充分，旋转轨迹 1.5s 转 39-52° 得分优势明显）
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - "dwb_critics::RotateToGoal"
        - "dwb_critics::BaseObstacle"     # reactive obstacle avoidance（8-30 修复: 移除 Oscillation——脉冲式旋转元凶）
        - "dwb_critics::GoalAlign"
        - "dwb_critics::GoalDist"
        - "dwb_critics::PathAlign"
        - "dwb_critics::PathDist"
        - "dwb_critics::PreferForward"
      dwb_critics::BaseObstacle.scale: 15.0
      dwb_critics::BaseObstacle.obstacle_cost_threshold: 150
      dwb_critics::RotateToGoal.scale: 32.0
      dwb_critics::RotateToGoal.slowing_factor: 5.0
      dwb_critics::RotateToGoal.lookahead_time: -1.0
      dwb_critics::GoalAlign.scale: 12.0
      dwb_critics::GoalAlign.forward_point_distance: 0.325
      dwb_critics::GoalDist.scale: 12.0
      dwb_critics::PathAlign.scale: 30.0     # 8-30 修复: 加 dwb_critics:: 前缀（裸名从未生效→不会转弯根因！）
      dwb_critics::PathDist.scale: 12.0    # 8-29 18:00: 16→12（旋转轨迹 PathDist 劣势减小，促进转弯）
      dwb_critics::PreferForward.scale: 0.0    # 8-29 18:00: 0.1→0（消除前进偏好，避免"目标在后方仍选前进"）

# =============================================================================
# Planner Server
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

# =============================================================================
# Behavior Server (Recovery Behaviors)
# =============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0

    # Only the behaviors actually used by the BT are listed here.
    # Additional plugins (backup, drive_on_heading, assisted_teleop, wait)
    # can be added when the BT references them.
    behavior_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

    # Global params shared by all behaviors
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.6
    # BackUp 倒车行为限速限距（防止 recovery 倒车撞障碍）
    backup_vel: -0.08
    backup_dist: 0.2

# =============================================================================
# BT Navigator — Behavior Tree for NavigateToPose
# =============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    # Standard NavigateToPose tree with recovery subtree
    # Available plugin libs: nav2_compute_path_to_pose_action_bt_node,
    # nav2_follow_path_action_bt_node, nav2_spin_action_bt_node,
    # nav2_wait_action_bt_node, nav2_back_up_action_bt_node,
    # nav2_assisted_teleop_action_bt_node
    # 8-29 18:00: navigate_to_pose_w_replanning_and_recovery.xml 每 1Hz 周期重规划，
    # 路径起点随车前移 → DWB 永远"追起点"不转弯。改用"路径失效才重规划 + 带 recovery"的树。
    default_bt_xml_filename: "navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node    # 8-29 18:00: 新 BT (replan only if path invalid) 需要
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_rate_controller_bt_node

# =============================================================================
# Waypoint Follower (NavigateThroughPoses)
# =============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# =============================================================================
# Velocity Smoother
# =============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.15, 1.0]       # [vx, vy, wz] — vy enabled for mecanum
    min_velocity: [-0.3, -0.15, -1.0]
    max_accel: [0.5, 0.3, 1.5]
    max_decel: [-0.5, -0.3, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0    # 8-22: 平衡——急停 1s 内停，controller 掉帧不顿挫（0.3 太短车振荡）

# =============================================================================
# Global Costmap
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 0.5
      resolution: 0.05
      width: 200          # 200 * 0.05 = 10m  (auto-resize on the fly)
      height: 200
      rolling_window: false
      always_send_full_costmap: false
      track_unknown_space: false
      transform_tolerance: 0.3

      # Robot footprint — rectangular approximation
      # Adjust these values to match your actual chassis dimensions.
      # Format: [[x1,y1], [x2,y2], ...] in meters, relative to base_link
      robot_radius: 0.20   # 8-30 19:08 修复: 0.17→0.20（实际车 0.40×0.35，昨天 0.17×0.15 配小→后轮刮障碍）
      footprint: "[[0.20, 0.175], [0.20, -0.175], [-0.20, -0.175], [-0.20, 0.175]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map_static     # 8-22: 只加载 map_relay 转发的完整图（避免 slam 局部图覆盖）
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.3    # 8-30 碰撞修复: 1.0→0.3（scan_filter 已滤 0m 假点+车体，0.3m 外是真实障碍；
                                     # 1.0 会滤掉近处障碍→避障盲区→撞墙）

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30    # 8-30 19:18 修复: 0.25→0.30（旋转扫掠半径=√(0.20²+0.175²)=0.266m！
                                  # 0.25 < 0.266 → 旋转时后轮超出保护 → 刮障碍 + DWB 旋转被判碰撞 → 后方目标左右摆动）
        cost_scaling_factor: 4.0    # 8-30 碰撞修复: 5.0→4.0（今天避障最终值，轮子保留余量）

# =============================================================================
# Local Costmap
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      width: 3            # 60 * 0.05 = 3m
      height: 3
      rolling_window: true
      always_send_full_costmap: false
      track_unknown_space: false
      transform_tolerance: 0.3

      robot_radius: 0.20
      footprint: "[[0.20, 0.175], [0.20, -0.175], [-0.20, -0.175], [-0.20, 0.175]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3    # 8-30 碰撞修复: 1.0→0.3（同 global：近处障碍必须感知）

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30    # 8-30 19:18 修复: 0.25→0.30（同 global：覆盖旋转扫掠 0.266m）
        cost_scaling_factor: 4.0    # 8-30 碰撞修复: 5.0→4.0


