# =============================================================================
# Nav2 Configuration for Armbot
# =============================================================================
# This file configures the full Navigation2 stack for the Armbot mecanum
# chassis robot. All nodes share the same namespace and parameter file.
#
# Frame convention:
#   map -> odom -> base_link -> laser
#
# Key design decisions:
#   - NavFn planner (lightweight, suitable for RDK X5 ARM CPU)
#   - RegulatedPurePursuit controller (stable indoor navigation)
#   - 3m x 3m local costmap, 0.05m resolution
#   - Conservative speeds: 0.25 m/s linear, 0.8 rad/s angular
# =============================================================================

# =============================================================================
# AMCL / Localization
# =============================================================================
# Note: We use slam_toolbox in localization mode instead of AMCL by default.
# This avoids needing a separate AMCL config. If you prefer AMCL, uncomment
# the amcl section below and swap the localization_node in nav.launch.py.
#
# amcl:
#   ros__parameters:
#     use_sim_time: false
#     alpha1: 0.2
#     alpha2: 0.2
#     alpha3: 0.2
#     alpha4: 0.2
#     alpha5: 0.2
#     base_frame_id: "base_link"
#     beam_skip_distance: 0.5
#     beam_skip_error_threshold: 0.9
#     beam_skip_threshold: 0.3
#     do_beamskip: false
#     global_frame_id: "map"
#     lambda_short: 0.1
#     laser_likelihood_max_dist: 2.0
#     laser_max_range: 8.0
#     laser_min_range: -1.0
#     laser_model_type: "likelihood_field"
#     max_beams: 60
#     max_particles: 2000
#     min_particles: 500
#     odom_frame_id: "odom"
#     pf_err: 0.05
#     pf_z: 0.99
#     recovery_alpha_fast: 0.0
#     recovery_alpha_slow: 0.0
#     resample_interval: 1
#     robot_model_type: "differential"
#     save_pose_rate: 0.5
#     sigma_hit: 0.2
#     tf_broadcast: true
#     transform_tolerance: 1.0
#     update_min_a: 0.2
#     update_min_d: 0.25
#     z_hit: 0.5
#     z_max: 0.05
#     z_rand: 0.5
#     z_short: 0.05
#     scan_topic: /scan

# =============================================================================
# Controller Server
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # --- Progress checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # --- Goal checker ---
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true

    # --- FollowPath (Regulated Pure Pursuit) ---
    # For mecanum holonomic mode, use DWB controller instead (see comments at bottom).
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.5
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

# =============================================================================
# Planner Server
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 1.0

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

# =============================================================================
# Behavior Server (Recovery Behaviors)
# =============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0

    # Only the behaviors actually used by the BT are listed here.
    # Additional plugins (backup, drive_on_heading, assisted_teleop, wait)
    # can be added when the BT references them.
    behavior_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

    # Global params shared by all behaviors
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

# =============================================================================
# BT Navigator — Behavior Tree for NavigateToPose
# =============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    # Standard NavigateToPose tree with recovery subtree
    # Available plugin libs: nav2_compute_path_to_pose_action_bt_node,
    # nav2_follow_path_action_bt_node, nav2_spin_action_bt_node,
    # nav2_wait_action_bt_node, nav2_back_up_action_bt_node,
    # nav2_assisted_teleop_action_bt_node
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - nav2_rate_controller_bt_node

# =============================================================================
# Waypoint Follower (NavigateThroughPoses)
# =============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# =============================================================================
# Velocity Smoother
# =============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]       # [vx, vy, wz]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [0.5, 0.0, 1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# =============================================================================
# Global Costmap
# =============================================================================
global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 1.0
    publish_frequency: 0.5
    resolution: 0.05
    width: 200          # 200 * 0.05 = 10m  (auto-resize on the fly)
    height: 200
    rolling_window: false
    always_send_full_costmap: false
    track_unknown_space: true
    transform_tolerance: 0.3

    # Robot footprint — rectangular approximation
    # Adjust these values to match your actual chassis dimensions.
    # Format: [[x1,y1], [x2,y2], ...] in meters, relative to base_link
    robot_radius: 0.17   # fallback if footprint fails; covers ~0.30x0.26 chassis
    footprint: "[[0.17, 0.15], [0.17, -0.15], [-0.17, -0.15], [-0.17, 0.15]]"

    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
      enabled: true
      subscribe_to_updates: true

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: "LaserScan"
        raytrace_max_range: 5.0
        raytrace_min_range: 0.1
        obstacle_max_range: 4.0
        obstacle_min_range: 0.1

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.25
      cost_scaling_factor: 5.0

# =============================================================================
# Local Costmap
# =============================================================================
local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    resolution: 0.05
    width: 60            # 60 * 0.05 = 3m
    height: 60
    rolling_window: true
    always_send_full_costmap: false
    track_unknown_space: false
    transform_tolerance: 0.3

    robot_radius: 0.17
    footprint: "[[0.17, 0.15], [0.17, -0.15], [-0.17, -0.15], [-0.17, 0.15]]"

    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: "LaserScan"
        raytrace_max_range: 3.0
        raytrace_min_range: 0.1
        obstacle_max_range: 2.5
        obstacle_min_range: 0.1

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.2
      cost_scaling_factor: 5.0


# =============================================================================
# DWB Controller (Alternative for Mecanum Holonomic Drive)
# =============================================================================
# Uncomment and switch controller_plugins to use DWB instead of RPP.
# DWB supports omnidirectional motion (vx + vy simultaneously), which
# is ideal for mecanum-wheel robots. It is heavier on CPU — test on
# RDK X5 before switching.
#
# To use: set controller_server.ros__parameters.controller_plugins to
# ["FollowPath"] and remove/comment the RPP FollowPath block above.
#
# FollowPath:
#   plugin: "dwb_core::DWBLocalPlanner"
#   debug_trajectory_details: true
#   min_vel_x: -0.3
#   min_vel_y: 0.0
#   max_vel_x: 0.3
#   max_vel_y: 0.0
#   max_vel_theta: 1.0
#   min_speed_xy: 0.0
#   max_speed_xy: 0.3
#   min_speed_theta: 0.0
#   acc_lim_x: 0.5
#   acc_lim_y: 0.5
#   acc_lim_theta: 1.5
#   decel_lim_x: -0.5
#   decel_lim_y: -0.5
#   decel_lim_theta: -1.5
#   vx_samples: 10
#   vy_samples: 0
#   vtheta_samples: 20
#   sim_time: 1.7
#   linear_granularity: 0.05
#   angular_granularity: 0.025
#   transform_tolerance: 0.2
#   xy_goal_tolerance: 0.15
#   trans_stopped_velocity: 0.01
#   short_circuit_trajectory_evaluation: true
#   stateful: true
#   critics:
#     - "dwb_critics::BaseObstacle"
#     - "dwb_critics::GoalAlign"
#     - "dwb_critics::GoalDist"
#     - "dwb_critics::PathAlign"
#     - "dwb_critics::PathDist"
#     - "dwb_critics::PreferForward"
#   BaseObstacle.scale: 1.0
#   GoalAlign.scale: 24.0
#   GoalAlign.forward_point_distance: 0.325
#   GoalDist.scale: 24.0
#   PathAlign.scale: 32.0
#   PathDist.scale: 32.0
#   PreferForward.scale: 0.1
