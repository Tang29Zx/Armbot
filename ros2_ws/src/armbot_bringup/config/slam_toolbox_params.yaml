slam_toolbox:
  ros__parameters:
    # --- Mode ---
    # "mapping" = online async SLAM (build map)
    # "localization" = load existing map, localize only
    mode: mapping

    # --- Frames ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # --- Map ---
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000  # 40 MB

    # --- Scan matching ---
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_max_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- Correlation parameters ---
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # --- Adaptive parameters ---
    enable_update_loop_closure: true
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.5

    # --- Publishers ---
    publish_map: true
    publish_scan_match: false
    publish_pose_graph: false
    publish_tf: true              # publish map->odom transform
    use_sim_time: false
