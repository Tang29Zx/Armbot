# YOLO26 medicine-box verifier configuration.
#
# Place this file at: auto_reconstruction/config/detection_config.yaml
# Launch with: ros2 launch auto_reconstruction perception.launch.py

yolo_verifier_node:
  ros__parameters:
    # Path to YOLO weights (.pt for PC/PyTorch, .engine for RDK X5/TensorRT).
    model_path: ""

    # Minimum confidence [0.0, 1.0] for a positive detection.
    confidence_threshold: 0.5

    # Class name to filter for (must match training data).
    target_class: "medicine_box"

    # ROS topic for input images.
    image_topic: "/image_raw"

    # Inference device: "cpu", "cuda", or "cuda:0".
    device: "cpu"

    # Whether to publish an annotated debug image on /yolo/annotated.
    publish_annotated: true

    # Path to a YAML file with calibrated_bbox (optional).
    # Generated by the calibration routine during setup.
    calib_file: ""
